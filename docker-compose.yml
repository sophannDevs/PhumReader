# Local services in Docker: Redis, Meilisearch, S3 storage (RustFS; stands in for Cloudflare R2) and Mailpit (catches email).
# An alternative to the Homebrew scripts (`npm run services:start`); use one or the other, they share the same ports.
#
#   npm run services:docker:up      start (and create the dev storage bucket)
#   npm run services:docker:down    stop (data stays); add `-v` by hand to wipe it
#   npm run services:check          all services should be healthy
#
# Ports are bound to 127.0.0.1 only. Settings come from backend/.env (same names as the brew scripts);
# the defaults below match backend/.env.example, so nothing needs to be set for a first run.
# Image tags can be overridden from the environment, e.g. MEILI_IMAGE=getmeili/meilisearch:v1.56.1.
name: phumreader

services:
  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: ${MEILI_IMAGE:-getmeili/meilisearch:v1.56.1}
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-phumreader-dev-meili-key}
    ports: ["127.0.0.1:7700:7700"]
    volumes: ["meili-data:/meili_data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage; stands in for Cloudflare R2. RustFS replaced MinIO here because MinIO no longer
  # publishes its community Docker images (Docker Hub and Quay both refuse the pull). Same ports as before.
  storage:
    image: ${STORAGE_IMAGE:-rustfs/rustfs:1.0.4}
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-phumreader}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-phumreader-dev-secret}
      RUSTFS_ADDRESS: ":9000"
    ports:
      - "127.0.0.1:9000:9000" # S3 API (S3_ENDPOINT)
    volumes: ["storage-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || wget -qO- http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-off job: creates the dev bucket (the name in S3_BUCKET), sets its CORS rule (the browser PUTs uploads straight
  # to storage; RustFS, unlike MinIO, sends no CORS headers by default) and exits.
  storage-bucket:
    image: ${AWS_CLI_IMAGE:-amazon/aws-cli:2.27.0}
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null ||
        aws --endpoint-url http://storage:9000 s3api create-bucket --bucket "$$S3_BUCKET";
        aws --endpoint-url http://storage:9000 s3api put-bucket-cors --bucket "$$S3_BUCKET"
        --cors-configuration '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3000}]}'
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-phumreader}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-phumreader-dev-secret}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-phumreader-dev}

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.27}
    ports:
      - "127.0.0.1:1025:1025" # SMTP (MAIL_HOST / MAIL_PORT)
      - "127.0.0.1:8025:8025" # web inbox
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  meili-data:
  storage-data:
