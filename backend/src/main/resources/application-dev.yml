# Local development (the default profile). Reads backend/.env (copy .env.example and fill it in).
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
      data-source-properties:
        # Sends batched INSERTs as multi-row statements (fast seeding over the network).
        reWriteBatchedInserts: true

  data:
    redis:
      # Empty: no Redis, rate limits and email codes stay in this API's memory.
      url: ${REDIS_URL:}

phumreader:
  redis:
    url: ${REDIS_URL:}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  auth:
    # Throw-away signing key; set PHUMREADER_JWT_PRIVATE_KEY to keep sign-ins across restarts.
    jwt-private-key: ${PHUMREADER_JWT_PRIVATE_KEY:}
    generate-dev-keys: true
    # Plain http://localhost: cookies without the Secure flag.
    secure-cookies: false
    # Every email code is 123456 in development (as in the demo), so end-to-end tests can sign up.
    fixed-verification-code: "123456"
  payments:
    # No PayWay keys on development machines: coin orders are paid with the dev simulator.
    simulator: true

management:
  endpoint:
    health:
      show-details: always
