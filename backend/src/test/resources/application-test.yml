# Tests run on an embedded PostgreSQL 17 started by the tests (Zonky): no Docker, no network,
# and backend/.env is never read.
phumreader:
  frontend-url: http://localhost:3000
  auth:
    generate-dev-keys: true
    # Any reuse of a rotated refresh token counts (tests move the clock).
    refresh-reuse-grace: 0s
  payments:
    simulator: true
    # Tests run the reconciliation by hand.
    reconcile-enabled: false
  notifications:
    # Tests run the dispatcher by hand.
    enabled: false
  catalog:
    # Tests change the clock and the data: always build the home feed fresh.
    home-cache-ttl: 0s

management:
  health:
    redis:
      # Tests use the in-memory stand-ins; no Redis is running.
      enabled: false
  endpoint:
    health:
      show-details: always

# English server messages whatever the machine's language; only warnings in the test log.
zonky:
  test:
    database:
      postgres:
        server:
          properties:
            lc_messages: C

logging:
  level:
    io.zonky.test.db.postgres.embedded: WARN
